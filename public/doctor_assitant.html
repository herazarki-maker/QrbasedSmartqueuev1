<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Assistant Dashboard</title>
    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    
    <!-- 🎨 Modern CSS Design -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Segoe UI', sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); 
            min-height: 100vh;
            padding: 40px 20px; 
            color: #1e293b;
        }
        
        /* 🌟 Main Container */
        .container { 
            max-width: 1000px; 
            margin: auto; 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.05); 
        }
        
        h2 { color: #0f172a; margin-bottom: 30px; text-align: center; font-size: 28px; font-weight: 700; }
        
        /* 🎛️ Dashboard Menu Buttons */
        #mainMenu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        
        .menu-btn { 
            display: flex; 
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%; 
            padding: 20px; 
            font-size: 18px; 
            font-weight: 600; 
            color: white; 
            border: none; 
            border-radius: 16px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.08); 
        }
        .btn-check { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .btn-time { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-cancel { background: linear-gradient(135deg, #ef4444, #dc2626); grid-column: span 2; margin-top: 20px; }
        .menu-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(0,0,0,0.15); }
        
        /* 📋 Queue Section */
        #queueSection { display: none; }
        
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px dashed #e2e8f0;
        }
        
        .back-btn { 
            background: #f1f5f9; color: #475569; border: none; padding: 12px 24px; 
            border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 15px; 
            transition: 0.3s; 
        }
        .back-btn:hover { background: #e2e8f0; color: #1e293b; }
        
        .date-filter {
            background: #f8fafc; padding: 15px 20px; border-radius: 12px; 
            border: 1px solid #e2e8f0; display: flex; align-items: center; 
            justify-content: space-between; gap: 15px; margin-bottom: 25px;
        }
        .date-filter label { font-weight: 600; color: #475569; }
        .date-filter input[type="date"] {
            padding: 10px 15px; border: 2px solid #cbd5e1; border-radius: 8px; 
            font-family: inherit; font-size: 15px; outline: none; transition: 0.3s;
        }
        .date-filter input[type="date"]:focus { border-color: #3b82f6; }
        .date-filter button {
            background: #3b82f6; color: white; border: none; padding: 10px 20px; 
            border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.3s;
        }
        .date-filter button:hover { background: #2563eb; }

        /* 📇 Dynamic Queue Cards (Generated by JS) */
        .queue-card { 
            display: flex; justify-content: space-between; align-items: center; 
            background: white; border-left: 6px solid #3b82f6; padding: 20px 25px; 
            margin-bottom: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); 
            transition: all 0.3s ease; border-right: 1px solid #f1f5f9; border-top: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9;
        }
        .queue-card:hover { transform: translateX(5px); box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
        .current-card { border-left-color: #10b981; background: #f0fdf4; border-right-color: #dcfce3; border-top-color: #dcfce3; border-bottom-color: #dcfce3;} 
        
        .token-text { font-size: 26px; font-weight: 700; color: #0f172a; }
        .patient-name { font-size: 15px; color: #64748b; margin-top: 4px; font-weight: 500;}
        
        .action-btn { 
            padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; 
            color: white; font-weight: 600; margin-left: 8px; font-size: 14px; transition: 0.3s; 
        }
        .btn-skip { background: #f1f5f9; color: #475569; }
        .btn-skip:hover { background: #e2e8f0; }
        .btn-complete { background: #10b981; }
        .btn-complete:hover { background: #059669; }

        /* 🪟 Modals */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(5px); 
            justify-content: center; align-items: center; z-index: 1000; 
        }
        .modal-content { 
            background: white; padding: 40px; border-radius: 20px; width: 90%; 
            max-width: 450px; box-shadow: 0 25px 50px rgba(0,0,0,0.15); 
        }
        .modal-content h3 { margin-bottom: 20px; color: #0f172a; font-size: 22px; font-weight: 700;}
        
        .time-inputs { display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px; }
        .time-inputs label { font-weight: 600; color: #475569; font-size: 14px; margin-bottom: 8px; display: block;}
        .time-inputs input { 
            width: 100%; padding: 12px 15px; border: 2px solid #e2e8f0; 
            border-radius: 10px; font-size: 16px; outline: none; transition: 0.3s;
        }
        .time-inputs input:focus { border-color: #10b981; }

        textarea { 
            width: 100%; height: 140px; padding: 15px; margin: 15px 0 25px; 
            border: 2px solid #e2e8f0; border-radius: 12px; resize: none; 
            font-size: 15px; outline: none; transition: 0.3s; font-family: inherit;
        }
        textarea:focus { border-color: #3b82f6; }
        
        .modal-btns { display: flex; justify-content: flex-end; gap: 12px; }

        @media (max-width: 768px) {
            #mainMenu { grid-template-columns: 1fr; }
            .btn-cancel { grid-column: span 1; }
            .queue-card { flex-direction: column; align-items: flex-start; gap: 15px; }
            .date-filter { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 🎛️ Main Menu -->
        <div id="mainMenu">
            <h2 id="dashboardTitle" style="grid-column: 1 / -1;">👨‍⚕️ Assistant Dashboard(Smart Clinic)</h2>
            
            <button class="menu-btn btn-check" onclick="openPatientCheck()">🩺 Patient Check</button>
            <button class="menu-btn btn-time" onclick="openTimeModal()">🕒 Time Changing</button>
            <button class="menu-btn" style="background: linear-gradient(135deg, #8b5cf6, #6d28d9); grid-column: 1 / -1;" onclick="generateTodayQR()">📱 Generate Today's QR</button>
            <button class="menu-btn btn-cancel" onclick="logout()">🚪 Logout</button>
        </div>

        <!-- 📋 Queue Section -->
        <div id="queueSection">
            <div class="header-actions">
                <button class="back-btn" onclick="goBack()">🔙 Back to Menu</button>
                <button id="startQueueBtn" class="menu-btn btn-check" style="width: auto; padding: 12px 25px; font-size: 16px; margin: 0;" onclick="startQueueAction()">▶️ Start Queue</button>
            </div>
            
            <div class="date-filter">
                <label for="viewDate">📅 ရက်စွဲအလိုက် ကြည့်မည် -</label>
                <div style="display: flex; gap: 10px;">
                    <input type="date" id="viewDate" onchange="loadQueueByDate()">
                    <button onclick="loadQueueByDate()">ရှာမည်</button>
                </div>
            </div>

            <h2>📋 Patient Queue</h2>
            
            <div id="queueList">
                <p style="text-align: center; color: #94a3b8; font-weight: 500;">Loading Queue...</p>
            </div>
        </div>
        
    </div>

    <!-- 🕒 Time Modal -->
    <div class="modal" id="timeModal">
        <div class="modal-content">
            <h3>🕒 ဆေးခန်း အချိန်သတ်မှတ်ရန်</h3>
            <div class="time-inputs">
                <div>
                    <label>ဖွင့်ချိန်:</label>
                    <input type="time" id="openTimeInput">
                </div>
                <div>
                    <label>ပိတ်ချိန်:</label>
                    <input type="time" id="closeTimeInput">
                </div>
            </div>
            <div class="modal-btns">
                <button class="action-btn" style="background: #f1f5f9; color: #475569;" onclick="closeTimeModal()">Cancel</button>
                <button class="action-btn btn-complete" onclick="saveSettings()">Save Changes</button>
            </div>
        </div>
    </div>

   <!-- 📝 Prescription Modal -->
   <div class="modal" id="prescriptionModal">
        <div class="modal-content">
            <h3>📝 ဆေးစာ ရေးရန်</h3>
            <p style="font-size: 14px; color: #64748b;">Token: <span id="modalTokenText" style="font-weight: 700; color: #3b82f6; font-size: 16px;"></span></p>
            
            <textarea id="prescriptionText" placeholder="ဆေးစာနှင့် မှတ်ချက်များ ဤနေရာတွင် ရိုက်ထည့်ပါ..."></textarea>
            
            <div class="modal-btns">
                <button class="action-btn" style="background: #f1f5f9; color: #475569;" onclick="closePrescriptionModal()">Cancel</button>
                <button class="action-btn btn-complete" onclick="submitComplete()">Save & Complete</button>
            </div>
        </div>
    </div>

    <!-- 📱 QR Modal -->
    <div class="modal" id="qrModal">
        <div class="modal-content" style="text-align: center;">
            <h3>📱 ယနေ့အတွက် Check-in QR</h3>
            <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">လူနာများအား ဤ QR ကိုပြသ၍ ဖတ်ခိုင်းပါ</p>
            
            <div style="background: #f8fafc; padding: 25px; border-radius: 16px; border: 2px dashed #cbd5e1; display: inline-block; margin-bottom: 25px;">
                <img id="qrImage" src="" alt="QR Code" style="width: 220px; height: 220px; display: none;">
                <p id="qrLoadingText" style="color: #3b82f6; font-weight: 600; margin: 40px 0;">Generating QR...</p>
            </div>
            
            <div class="modal-btns" style="justify-content: center;">
                <button class="action-btn btn-check" style="width: 100%; margin: 0; padding: 14px; font-size: 16px;" onclick="closeQRModal()">အိုကေ (ပိတ်မည်)</button>
            </div>
        </div>
    </div>
    <script>
        const DOCTOR_CODE = localStorage.getItem("doctorCode");
        
        if (!DOCTOR_CODE) {
            alert("Doctor Code not found. Please log in again.");
            window.location.href = "/";
        }
        
        const headingElement = document.getElementById("dashboardTitle");
        if(headingElement) {
            const doctorName = localStorage.getItem("doctorName") || DOCTOR_CODE;
            headingElement.innerText = `👨‍⚕️ Assistant Dashboard ( ${doctorName})`;
        }

        let currentAppointmentId = null;
        let clinicOpenTime = "10:00";
        let clinicCloseTime = "12:30";
        let isQueueStarted = false; 

        const socket = io();
        socket.on("update_queue", () => {
            console.log("🔔 Server မှ Signal ရောက်လာပါပြီ!"); 
            if (isQueueStarted) {
                loadQueue(); // Queue စပြီးသွားရင် Live အခြေအနေပြမည်
            } else {
                loadQueueByDate(); // မစရသေးခင်ဆိုရင် Read-only ပြမည်
            }
        });

        window.onload = fetchSettings;

        function logout() {
            localStorage.clear();
            window.location.href = "/";
        }

        function goBack() {
            window.location.reload(); 
        }

        function openPatientCheck() {
            document.getElementById("mainMenu").style.display = "none";
            document.getElementById("queueSection").style.display = "block";
            
            const viewDateInput = document.getElementById('viewDate');
            if (viewDateInput) {
                viewDateInput.value = new Date().toLocaleDateString('en-CA');
                loadQueueByDate(); 
            }
        }

        function openTimeModal() { document.getElementById("timeModal").style.display = "flex"; }
        function closeTimeModal() { document.getElementById("timeModal").style.display = "none"; }

       async function fetchSettings() {
            // 🌟 ပြင်ဆင်ချက်: URL အနောက်တွင် doctor_code ကို တွဲပို့ပေးမည်
            const response = await fetch(`/api/settings?doctor_code=${DOCTOR_CODE}`);
            const result = await response.json();
            if(result.success) {
                clinicOpenTime = result.settings.open_time;
                clinicCloseTime = result.settings.close_time;
                document.getElementById("openTimeInput").value = clinicOpenTime;
                document.getElementById("closeTimeInput").value = clinicCloseTime;
            }
        }

        async function saveSettings() {
            const newOpen = document.getElementById("openTimeInput").value;
            const newClose = document.getElementById("closeTimeInput").value;

            const response = await fetch("/api/settings/update", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                // 🌟 ပြင်ဆင်ချက်: Backend သို့ doctor_code ကိုပါ ထည့်သွင်း ပေးပို့မည်
                body: JSON.stringify({ 
                    doctor_code: DOCTOR_CODE, 
                    open_time: newOpen, 
                    close_time: newClose 
                })
            });
            const result = await response.json();
            if(result.success) {
                alert(result.message);
                clinicOpenTime = newOpen;
                clinicCloseTime = newClose;
                closeTimeModal();
            }
        }

       

        // 🌟 "Start Queue" ကို နှိပ်လိုက်သောအခါ
        async function startQueueAction() {
            isQueueStarted = true;
            document.getElementById("startQueueBtn").style.display = "none"; 
            
            await fetch("/api/assistant/start-queue", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ doctor_code: DOCTOR_CODE })
            });

            loadQueue(); // Live Queue (လုပ်ဆောင်ခွင့်များပါသော ဇယား) ကို ခေါ်မည်
        }

        
       // 🌟 Live Queue (Start လုပ်ပြီးမှ အလုပ်လုပ်မည့် ဇယား)
        async function loadQueue() {
            const listDiv = document.getElementById("queueList");
            listDiv.innerHTML = `<p style="text-align: center; color: #777; margin-top: 20px;">Loading Active Queue...</p>`;

            const response = await fetch(`/api/assistant/queue/${DOCTOR_CODE}`);
            const result = await response.json();
            
            listDiv.innerHTML = "";

            if (result.success && result.queue.length > 0) {
                // 🌟 ပြင်ဆင်ချက်: ပြီးသွားသောသူများနှင့် No-show များကို ဖယ်ထုတ်ပြီးမှ ဇယားဆွဲမည်
                const activePatients = result.queue.filter(p => p.status !== 'completed' && p.status !== 'no-show' && p.status !== 'cancelled');

                if (activePatients.length > 0) {
                    activePatients.forEach((patient, index) => {
                        const validId = patient.Appointment_id || patient.appointment_id || patient.id; 
                        const isTopPatient = (index === 0 && isQueueStarted); 
                        
                        const card = document.createElement("div");
                        card.className = `queue-card ${isTopPatient ? "current-card" : ""}`;
                        
                        let actionUI = "";

                        if (isTopPatient) {
                            if (patient.status === 'waiting') {
                                actionUI = `
                                 <span style="color:#dc3545; font-size:13px; font-weight:bold; margin-right: 10px;">🔴 QR မဖတ်ရသေးပါ</span>
                                 <button class="action-btn btn-skip" onclick="skipPatient('${validId}')">Skip</button>
                                 <button class="action-btn" onclick="markNoShow('${validId}', '${patient.patient_uid}')" style="background: #f97316; color: white; margin-left: 5px;">Absent</button>
                                 <button class="action-btn" onclick="cancelPatient('${validId}')" style="background: #ef4444; color: white; margin-left: 5px;">Cancel</button>
                                     `;
                            } else if (patient.status === 'arrived') {
                                actionUI = `
                                    <span style="color:#198754; font-size:13px; font-weight:bold; margin-right: 10px;">✅ ရောက်ရှိပါပြီ</span>
                                    <button class="action-btn" onclick="callPatient('${validId}', '${patient.token_number}')" style="background: #0d6efd; color: white;">📢 Call Next</button>
                                `;
                            } else if (patient.status === 'consulting') {
                                actionUI = `
                                    <span style="color:#8b5cf6; font-size:13px; font-weight:bold; margin-right: 10px;">👨‍⚕️ Current treating</span>
                                    <button class="action-btn btn-complete" onclick="openPrescriptionModal('${validId}', '${patient.token_number}')">Complete</button>
                                `;
                            } else if (patient.status === 'skipped') {
                                actionUI = `
                                    <span style="color:#f97316; font-size:13px; font-weight:bold; margin-right: 10px;">⏭️ ယာယီကျော်ထားပါသည်</span>
                                    <button class="action-btn btn-skip" onclick="skipPatient('${validId}')">Skip</button>
                                    <button class="action-btn" onclick="markNoShow('${validId}', '${patient.patient_uid}')" style="background: #f97316; color: white; margin-left: 5px;">Absent</button>
                                    <button class="action-btn" onclick="cancelPatient('${validId}')" style="background: #ef4444; color: white; margin-left: 5px;">Cancel</button>
                                      `;
                           }
                        } else {
                            // အောက်က တန်းစီနေသူများအတွက်
                            if (patient.status === 'waiting') {
                                actionUI = `
                                    <span style="color:#dc3545; font-size:13px; font-weight:bold; margin-right: 10px;">🔴 QR မဖတ်ရသေးပါ</span>
                                    <button class="action-btn" onclick="cancelPatient('${validId}')" style="background: #ef4444; color: white; padding: 5px 10px; font-size: 12px;">Cancel</button>
                                `;
                            } else if (patient.status === 'arrived') {
                                actionUI = `<span style="color:#198754; font-size:13px; font-weight:bold;">✅ ရောက်ရှိပါပြီ</span>`;
                            } else if (patient.status === 'consulting') {
                                actionUI = `<span style="color:#8b5cf6; font-size:13px; font-weight:bold;">👨‍⚕️ Current treating</span>`;
                            // isTopPatient မဟုတ်ဘဲ အောက်က တန်းစီနေသူများအတွက် စစ်တဲ့နေရာမှာ ဒါလေး ထပ်ဖြည့်ပါ
                           } else if (patient.status === 'skipped') {
                               actionUI = `
                                       <span style="color:#f97316; font-size:13px; font-weight:bold; margin-right: 10px;">⏭️ ယာယီကျော်ထားပါသည်</span>
                                       <button class="action-btn" onclick="cancelPatient('${validId}')" style="background: #ef4444; color: white; padding: 5px 10px; font-size: 12px;">Cancel</button>
                                        `;
}
                           
                        }
                        card.innerHTML = `
                            <div>
                                <div class="token-text">${patient.token_number}</div>
                                <div class="patient-name" style="font-weight: bold; font-size: 17px;">👤 ${patient.patient_name || 'Unknown Patient'}</div>
                            </div>
                            <div>${actionUI}</div>
                        `;
                        listDiv.appendChild(card);
                    });
                } else {
                    listDiv.innerHTML = `<p style="text-align: center; color: #198754; font-size: 18px; margin-top: 20px; font-weight: bold;">ယနေ့အတွက် လူနာအားလုံးကို ကြည့်ရှုပြီးပါပြီ။</p>`;
                }
            } else {
                listDiv.innerHTML = `<p style="text-align: center; color: #777; margin-top: 20px;">ယနေ့အတွက် Booking တင်ထားသော လူနာမရှိသေးပါ။</p>`;
            }
        }
        

        // 🌟 Date ဖြင့် ကြည့်သောအခါ (Read-only ဇယား)
        async function loadQueueByDate() {
            // အကယ်၍ Queue Start နေပြီဆိုလျှင် Date Picker မှ ရွေးသော်လည်း Live Queue ကိုသာ ပြမည်
            if (isQueueStarted) {
                loadQueue();
                return;
            }

            const selectedDate = document.getElementById('viewDate').value;
            if (!selectedDate) return;

            const listDiv = document.getElementById("queueList");
            listDiv.innerHTML = `<p style="text-align: center; color: #777; margin-top: 20px;">Loading Queue...</p>`;

            try {
                const response = await fetch(`/api/assistant/view-queue/${DOCTOR_CODE}/${selectedDate}`);
                const result = await response.json();

                listDiv.innerHTML = ""; 

                if (result.success && result.appointments.length > 0) {
                    result.appointments.forEach((patient) => {
                        const card = document.createElement("div");
                        card.className = "queue-card";
                        
                        let statusUI = "";
                        if (patient.status === 'waiting') {
                            statusUI = `<span style="color:#dc3545; font-size:13px; font-weight:bold;">🔴 QR မဖတ်ရသေးပါ</span>`;
                        } else if (patient.status === 'arrived') {
                            statusUI = `<span style="color:#198754; font-size:13px; font-weight:bold;">✅ ရောက်ရှိပါပြီ</span>`;
                        } else {
                            statusUI = `<span style="color:#0d6efd; font-size:13px; font-weight:bold; text-transform: capitalize;">${patient.status}</span>`;
                        }

                      card.innerHTML = `
                            <div>
                                <div class="token-text">${patient.token_number}</div>
                                <div class="patient-name" style="font-weight: bold; font-size: 17px;">👤 ${patient.patient_name || 'Unknown Patient'}</div>
                            </div>
                            <div>${statusUI}</div>
                        `;
                        listDiv.appendChild(card);
                    });
                } else {
                    listDiv.innerHTML = `<p style="text-align: center; color: #777; margin-top: 20px;">ရွေးချယ်ထားသော ရက်စွဲအတွက် Booking မရှိသေးပါ။</p>`;
                }
            } catch (error) {
                console.error("Queue Load Error:", error);
                listDiv.innerHTML = `<p style="text-align: center; color: red; margin-top: 20px;">Network Error ဖြစ်နေပါသည်။</p>`;
            }
        }

        async function skipPatient(appointmentId) {
            if(!confirm("ဤလူနာကို Skip လုပ်ပြီး အနောက်ဆုံးသို့ ပို့မည်မှာ သေချာပါသလား?")) return;
            const response = await fetch("/api/assistant/skip", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ appointment_id: appointmentId })
            });
            const result = await response.json();
            if (result.success) loadQueue(); 
        }

        async function cancelPatient(appointmentId) {
            const confirmCancel = confirm("⚠️ ဒီလူနာရဲ့ Booking ကို တကယ် ဖျက်မှာ သေချာပြီလား?");
            if (!confirmCancel) return;
            try {
                const response = await fetch(`/api/appointment/${appointmentId}`, { method: 'DELETE' });
                const result = await response.json();
                if (result.success) {
                    alert(result.message);
                    loadQueue(); 
                } else {
                    alert("Error: " + result.message);
                }
            } catch (error) {
                alert("Network Error ကြောင့် ဖျက်၍ မရပါ။");
            }
        }

        function openPrescriptionModal(appointmentId, tokenNumber) {
            currentAppointmentId = appointmentId;
            document.getElementById("modalTokenText").innerText = tokenNumber;
            document.getElementById("prescriptionText").value = ""; 
            document.getElementById("prescriptionModal").style.display = "flex";
        }

        function closePrescriptionModal() {
            document.getElementById("prescriptionModal").style.display = "none";
            currentAppointmentId = null;
        }

        async function submitComplete() {
            const pText = document.getElementById("prescriptionText").value;
            if (!pText.trim()) return alert("ကျေးဇူးပြု၍ ဆေးကုသမှုညွှန်ကြားချက် ရေးပါ။");

            const response = await fetch("/api/assistant/complete", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ appointment_id: currentAppointmentId, prescription: pText })
            });

            const result = await response.json();
            if (result.success) {
                closePrescriptionModal();
                loadQueue(); 
            }
        }
        // 🌟 "Call Next" ခလုတ်နှိပ်လျှင် အလုပ်လုပ်မည့် Function
        async function callPatient(appointmentId, tokenNum) {
            const response = await fetch("/api/assistant/call", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ appointment_id: appointmentId, token_number: tokenNum, doctor_code: DOCTOR_CODE })
            });
            const result = await response.json();
            if(result.success) {
                loadQueue(); // ဇယားကို Update ပြန်လုပ်မည်
            }
        }
        // 🌟 ၁။ QR Code အလိုအလျောက် တွက်ချက်ထုတ်ပေးမည့် Function
        function generateTodayQR() {
            document.getElementById("qrModal").style.display = "flex";
            
            // ယနေ့ရက်စွဲကို 'YYYY-MM-DD' ပုံစံဖြင့် ယူမည်
            const todayDate = new Date().toLocaleDateString('en-CA'); 
            
            // Server က တောင်းဆိုထားသော ပုံစံအတိုင်း စာသားကို ဖွဲ့စည်းမည် (ဥပမာ - QR_MK_2026-08-15)
            const qrText = `QR_${DOCTOR_CODE}_${todayDate}`; 
            
            const qrImg = document.getElementById("qrImage");
            const loadingText = document.getElementById("qrLoadingText");
            
            qrImg.style.display = "none";
            loadingText.style.display = "block";
            
            // 💡 အခမဲ့ (Free) QR Code Generation API ကို အသုံးပြု၍ ပုံထုတ်မည်
            qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(qrText)}&color=000000&bgcolor=ffffff`;
            
            // ပုံဆွဲယူလို့ ပြီးသွားမှ Loading စာသားကိုဖျောက်ပြီး QR ပုံကို ပြမည်
            qrImg.onload = function() {
                loadingText.style.display = "none";
                qrImg.style.display = "block";
            };
        }

        // 🌟 ၂။ QR Modal ကို ပြန်ပိတ်မည့် Function
        function closeQRModal() {
            document.getElementById("qrModal").style.display = "none";
        }
        async function markNoShow(appointmentId, patientUid) {
            const confirmNoShow = confirm("⚠️ ဤလူနာကို absent (ပျက်ကွက်) အဖြစ် သတ်မှတ်မှာ သေချာပါသလား?\n(စည်းကမ်းဖောက်ဖျက်မှုအဖြစ် မှတ်တမ်းဝင်သွားပါမည်)");
            if (!confirmNoShow) return;

            const response = await fetch("/api/assistant/no-show", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ appointment_id: appointmentId, patient_uid: patientUid })
            });

            const result = await response.json();
            alert(result.message);
            if (result.success) {
                loadQueue(); // ဇယားကို Refresh လုပ်မည်
            }
        }
    </script>
