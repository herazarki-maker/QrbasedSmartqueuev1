<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Locked - QR Smart Queue</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .lock-container {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border-top: 5px solid #ef4444; /* အနီရောင်လိုင်းလေး */
        }
        .lock-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        .title {
            color: #0f172a;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .message {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .back-btn {
            background-color: #1e293b;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .back-btn:hover {
            background-color: #0f172a;
        }
    </style>
</head>
<body>

    <div class="lock-container">
        <div class="lock-icon">🔒</div>
        <div class="title">Account Locked</div>
        <div class="message">
            Your account is currently <strong>locked</strong> due to repeated violations of hospital rules (e.g., Late check-ins or No-shows). <br><br>
            Please contact the <strong>Admin Counter</strong> to unlock your account.
        </div>
        <button class="back-btn" onclick="window.location.href='index.html'">Return to Login</button>
    </div>

</body>
</html>
